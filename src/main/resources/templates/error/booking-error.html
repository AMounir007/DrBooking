<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}"
      th:dir="${#locale.language == 'ar'} ? 'rtl' : 'ltr'">
<head th:replace="~{fragments/layout :: head(#{error.title})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container section" style="max-width:520px">
    <div class="card">
        <h1 th:text="#{error.title}">Oops</h1>
        <p class="muted" th:text="${message}">Booking not found.</p>
        <a class="btn" th:href="@{/}" th:text="#{error.back}">Back to home</a>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
