<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}"
      th:dir="${#locale.language == 'ar'} ? 'rtl' : 'ltr'">
<head th:replace="~{fragments/layout :: head(#{avail.title})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container section">
    <div class="row-flex" style="justify-content:space-between">
        <h1 th:text="#{avail.title}">Availability</h1>
        <a class="btn secondary" th:href="@{/dashboard}" th:text="#{avail.back}">Back to dashboard</a>
    </div>

    <div class="alert success" th:if="${param.saved}" th:text="#{avail.saved}"></div>
    <div class="alert success" th:if="${param.blocked}" th:text="#{avail.blocked}"></div>

    <div class="card">
        <h2 th:text="#{avail.weekly}">Weekly working hours</h2>
        <p class="muted" th:text="#{avail.alltimes(${provider.zoneId})}"></p>
        <form th:action="@{/dashboard/availability}" th:object="${hoursForm}" method="post">
            <table>
                <thead>
                <tr>
                    <th th:text="#{avail.th.day}">Day</th>
                    <th th:text="#{avail.th.open}">Open</th>
                    <th th:text="#{avail.th.from}">From</th>
                    <th th:text="#{avail.th.to}">To</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="row, it : *{rows}">
                    <td th:text="#{'day.' + ${row.dayOfWeek}}">Monday</td>
                    <td>
                        <input type="checkbox" th:field="*{rows[__${it.index}__].enabled}">
                    </td>
                    <td><input type="time" th:field="*{rows[__${it.index}__].startTime}" style="margin-bottom:0"></td>
                    <td><input type="time" th:field="*{rows[__${it.index}__].endTime}" style="margin-bottom:0"></td>
                    <input type="hidden" th:field="*{rows[__${it.index}__].dayOfWeek}">
                </tr>
                </tbody>
            </table>
            <button class="btn" type="submit" style="margin-top:14px" th:text="#{avail.save}">Save working hours</button>
        </form>
    </div>

    <div class="card" style="margin-top:20px">
        <h2 th:text="#{avail.block.title}">Blocked time</h2>
        <p class="muted" th:text="#{avail.block.desc}"></p>

        <form th:action="@{/dashboard/time-off}" method="post" class="grid grid-2">
            <div>
                <label for="start" th:text="#{avail.block.from}">From</label>
                <input type="datetime-local" id="start" name="start" required>
            </div>
            <div>
                <label for="end" th:text="#{avail.block.to}">To</label>
                <input type="datetime-local" id="end" name="end" required>
            </div>
            <div>
                <label for="reason" th:text="#{avail.block.reason}">Reason</label>
                <input type="text" id="reason" name="reason" th:placeholder="#{avail.block.reason.ph}">
            </div>
            <div style="align-self:end">
                <button class="btn" type="submit" style="margin-bottom:14px" th:text="#{avail.block.add}">Block this period</button>
            </div>
        </form>

        <table th:unless="${timeOffs.isEmpty()}">
            <thead>
            <tr>
                <th th:text="#{avail.block.from}">From</th>
                <th th:text="#{avail.block.to}">To</th>
                <th th:text="#{avail.block.reason}">Reason</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="t : ${timeOffs}">
                <td th:text="${#temporals.format(t.startAt.atZone(provider.zone()), 'dd MMM yyyy HH:mm', #locale)}"></td>
                <td th:text="${#temporals.format(t.endAt.atZone(provider.zone()), 'dd MMM yyyy HH:mm', #locale)}"></td>
                <td th:text="${t.reason}"></td>
                <td>
                    <form th:action="@{'/dashboard/time-off/' + ${t.id} + '/delete'}" method="post">
                        <button class="btn small danger" type="submit" th:text="#{avail.block.remove}">Remove</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
