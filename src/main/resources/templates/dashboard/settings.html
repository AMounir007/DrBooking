<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}"
      th:dir="${#locale.language == 'ar'} ? 'rtl' : 'ltr'">
<head th:replace="~{fragments/layout :: head(#{settings.title})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container section" style="max-width:640px">
    <div class="row-flex" style="justify-content:space-between">
        <h1 th:text="#{settings.title}">Settings</h1>
        <a class="btn secondary" th:href="@{/dashboard}" th:text="#{avail.back}">Back to dashboard</a>
    </div>

    <div class="alert success" th:if="${param.saved}" th:text="#{settings.saved}"></div>

    <div class="card">
        <form th:action="@{/dashboard/settings}" th:object="${profileForm}" method="post">
            <label for="displayName" th:text="#{settings.displayName}">Display name</label>
            <input type="text" id="displayName" th:field="*{displayName}">

            <label for="businessName" th:text="#{settings.businessName}">Business name</label>
            <input type="text" id="businessName" th:field="*{businessName}">

            <label for="whatsappNumber" th:text="#{settings.whatsapp}">WhatsApp number</label>
            <input type="text" id="whatsappNumber" class="ltr" th:field="*{whatsappNumber}" placeholder="201234567890">

            <label for="zoneId" th:text="#{settings.timezone}">Time zone</label>
            <select id="zoneId" th:field="*{zoneId}">
                <option th:each="z : ${zones}" th:value="${z}" th:text="${z}"></option>
            </select>

            <label for="language" th:text="#{settings.language}">Notification language</label>
            <select id="language" th:field="*{language}">
                <option value="ar" th:text="#{lang.arabic}">العربية</option>
                <option value="en" th:text="#{lang.english}">English</option>
            </select>

            <div class="grid grid-2">
                <div>
                    <label for="slotMinutes" th:text="#{settings.slotlen}">Appointment length</label>
                    <input type="number" id="slotMinutes" th:field="*{slotMinutes}" min="5" max="480">
                </div>
                <div>
                    <label for="bufferMinutes" th:text="#{settings.buffer}">Buffer</label>
                    <input type="number" id="bufferMinutes" th:field="*{bufferMinutes}" min="0" max="240">
                </div>
            </div>

            <label for="bookingHorizonDays" th:text="#{settings.horizon}">Days ahead</label>
            <input type="number" id="bookingHorizonDays" th:field="*{bookingHorizonDays}" min="1" max="365">

            <label for="description" th:text="#{settings.description}">Short description</label>
            <textarea id="description" rows="3" th:field="*{description}"></textarea>

            <button class="btn" type="submit" th:text="#{settings.save}">Save settings</button>
        </form>
    </div>

    <div class="card" style="margin-top:20px">
        <h3 th:text="#{settings.calendar.title}">Calendar synchronisation</h3>
        <p class="muted" th:text="#{settings.calendar.desc}"></p>
        <button class="btn secondary" type="button" disabled th:text="#{settings.calendar.connect}">Connect Google Calendar</button>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
