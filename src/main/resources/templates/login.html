<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}"
      th:dir="${#locale.language == 'ar'} ? 'rtl' : 'ltr'">
<head th:replace="~{fragments/layout :: head(#{login.title})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container section" style="max-width:420px">
    <div class="card">
        <h1 th:text="#{login.title}">Log in</h1>
        <div class="alert error" th:if="${param.error}" th:text="#{login.error}"></div>
        <div class="alert success" th:if="${param.registered}" th:text="#{login.registered}"></div>
        <form th:action="@{/login}" method="post">
            <label for="username" th:text="#{login.email}">E-mail</label>
            <input type="email" id="username" name="username" class="ltr" required autofocus>
            <label for="password" th:text="#{login.password}">Password</label>
            <input type="password" id="password" name="password" class="ltr" required>
            <button class="btn" type="submit" th:text="#{login.submit}">Log in</button>
        </form>
        <p class="muted">
            <span th:text="#{login.noaccount}"></span>
            <a th:href="@{/register}" th:text="#{login.create}"></a>
        </p>
        <p class="muted ltr" th:text="#{login.demo}"></p>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
