<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}"
      th:dir="${#locale.language == 'ar'} ? 'rtl' : 'ltr'">
<head th:replace="~{fragments/layout :: head(#{home.title})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <section class="hero">
        <h1 th:text="#{home.hero.title}">Stop chasing appointments.</h1>
        <p th:text="#{home.hero.subtitle}">Share one link...</p>
        <div class="row-flex" style="justify-content:center">
            <a class="btn" th:href="@{/register}" th:text="#{home.cta.create}">Create your booking page</a>
            <a class="btn secondary" th:href="@{/dr-ahmed}" th:text="#{home.cta.example}">See a live example</a>
        </div>
    </section>

    <section class="grid grid-3 section">
        <div class="card">
            <h3 th:text="#{home.f1.title}">Personal booking page</h3>
            <p class="muted" th:text="#{home.f1.text}"></p>
        </div>
        <div class="card">
            <h3 th:text="#{home.f2.title}">Automatic reminders</h3>
            <p class="muted" th:text="#{home.f2.text}"></p>
        </div>
        <div class="card">
            <h3 th:text="#{home.f3.title}">No conflicts</h3>
            <p class="muted" th:text="#{home.f3.text}"></p>
        </div>
    </section>

    <section class="section">
        <h2 th:text="#{home.plans.title}">Plans</h2>
        <div class="grid grid-3">
            <div class="card" th:each="plan : ${plans}">
                <h3 th:text="#{'plan.' + ${plan.name()}}">Plan</h3>
                <p class="muted">
                    <span th:if="${plan.monthlyBookingLimit < 1000000}"
                          th:text="#{plan.upto(${plan.monthlyBookingLimit})}"></span>
                    <span th:if="${plan.monthlyBookingLimit >= 1000000}" th:text="#{plan.unlimited}"></span>
                </p>
                <ul class="muted">
                    <li th:text="${plan.emailReminders} ? #{plan.email.yes} : #{plan.email.no}"></li>
                    <li th:text="${plan.whatsappReminders} ? #{plan.whatsapp.yes} : #{plan.whatsapp.no}"></li>
                </ul>
                <a class="btn" th:href="@{/register}" th:text="#{plan.choose}">Choose</a>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
