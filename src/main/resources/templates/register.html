<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}"
      th:dir="${#locale.language == 'ar'} ? 'rtl' : 'ltr'">
<head th:replace="~{fragments/layout :: head(#{register.title})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container section" style="max-width:560px">
    <div class="card">
        <h1 th:text="#{register.title}">Create your booking page</h1>

        <form th:action="@{/register}" th:object="${form}" method="post">
            <div class="alert error" th:if="${#fields.hasGlobalErrors()}">
                <span th:each="err : ${#fields.globalErrors()}" th:text="${err}"></span>
            </div>

            <label for="displayName" th:text="#{register.name}">Your name</label>
            <input type="text" id="displayName" th:field="*{displayName}">
            <div class="error-text" th:if="${#fields.hasErrors('displayName')}" th:errors="*{displayName}"></div>

            <label for="businessName" th:text="#{register.business}">Business name</label>
            <input type="text" id="businessName" th:field="*{businessName}">

            <label for="slug" th:text="#{register.link}">Your booking link</label>
            <input type="text" id="slug" class="ltr" th:field="*{slug}" placeholder="dr-ahmed">
            <div class="error-text" th:if="${#fields.hasErrors('slug')}" th:errors="*{slug}"></div>

            <label for="zoneId" th:text="#{register.timezone}">Time zone</label>
            <select id="zoneId" th:field="*{zoneId}">
                <option th:each="z : ${zones}" th:value="${z}" th:text="${z}"></option>
            </select>

            <label for="language" th:text="#{register.language}">Notification language</label>
            <select id="language" th:field="*{language}">
                <option value="ar" th:text="#{lang.arabic}">العربية</option>
                <option value="en" th:text="#{lang.english}">English</option>
            </select>

            <label for="email" th:text="#{register.email}">E-mail</label>
            <input type="email" id="email" class="ltr" th:field="*{email}">
            <div class="error-text" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

            <label for="password" th:text="#{register.password}">Password</label>
            <input type="password" id="password" class="ltr" th:field="*{password}">
            <div class="error-text" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>

            <button class="btn" type="submit" th:text="#{register.submit}">Create my page</button>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
