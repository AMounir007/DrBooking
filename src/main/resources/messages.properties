# ---------- Home ----------
home.title=Booking and scheduling made simple
home.hero.title=Stop chasing appointments.
home.hero.subtitle=Share one link, let your clients pick a free slot, and let DrBooking send the confirmations and reminders for you. No double bookings, far fewer no-shows.
home.cta.create=Create your booking page
home.cta.example=See a live example
home.f1.title=Personal booking page
home.f1.text=Your own link such as /dr-ahmed. Clients see only the times you are really free and book in under a minute.
home.f2.title=Automatic reminders
home.f2.text=Instant confirmation plus reminders 24 hours and 2 hours before the appointment by e-mail or WhatsApp.
home.f3.title=No conflicts
home.f3.text=Working hours, buffers and personal time-off blocks are applied automatically, so a slot can never be booked twice.
home.plans.title=Plans

