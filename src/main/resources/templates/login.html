<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Log in')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container section" style="max-width:420px">
    <div class="card">
        <h1>Log in</h1>
        <div class="alert error" th:if="${param.error}">Invalid e-mail or password.</div>
        <div class="alert success" th:if="${param.registered}">Account created. Please log in.</div>
        <form th:action="@{/login}" method="post">
            <label for="username">E-mail</label>
            <input type="email" id="username" name="username" required autofocus>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
            <button class="btn" type="submit">Log in</button>
        </form>
        <p class="muted">No account yet? <a th:href="@{/register}">Create one</a></p>
        <p class="muted">Demo: dr.ahmed@example.com / password123</p>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
