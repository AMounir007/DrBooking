<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}"
      th:dir="${#locale.language == 'ar'} ? 'rtl' : 'ltr'">
<head th:replace="~{fragments/layout :: head(#{pricing.title})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container section">
    <h1 th:text="#{pricing.title}">Simple pricing</h1>
    <p class="muted" th:text="#{pricing.subtitle}"></p>

    <div class="grid grid-3">
        <div class="card">
            <h3 th:text="#{plan.FREE}">Free</h3>
            <p class="stat">$0</p>
            <ul class="muted">
                <li th:text="#{pricing.free.f1}"></li>
                <li th:text="#{pricing.free.f2}"></li>
                <li th:text="#{pricing.free.f3}"></li>
            </ul>
            <a class="btn" th:href="@{/register}" th:text="#{pricing.free.cta}">Start free</a>
        </div>
        <div class="card">
            <h3 th:text="#{plan.BASIC}">Basic</h3>
            <p class="stat">$15<span class="muted" th:text="#{pricing.month}">/mo</span></p>
            <ul class="muted">
                <li th:text="#{pricing.basic.f1}"></li>
                <li th:text="#{pricing.basic.f2}"></li>
                <li th:text="#{pricing.basic.f3}"></li>
            </ul>
            <a class="btn" th:href="@{/register}" th:text="#{pricing.basic.cta}">Choose Basic</a>
        </div>
        <div class="card">
            <h3 th:text="#{plan.PRO}">Pro</h3>
            <p class="stat">$39<span class="muted" th:text="#{pricing.month}">/mo</span></p>
            <ul class="muted">
                <li th:text="#{pricing.pro.f1}"></li>
                <li th:text="#{pricing.pro.f2}"></li>
                <li th:text="#{pricing.pro.f3}"></li>
                <li th:text="#{pricing.pro.f4}"></li>
            </ul>
            <a class="btn" th:href="@{/register}" th:text="#{pricing.pro.cta}">Choose Pro</a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
