<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}"
      th:dir="${#locale.language == 'ar'} ? 'rtl' : 'ltr'">
<head th:replace="~{fragments/layout :: head(#{manage.title})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container section" style="max-width:600px">
    <div class="alert success" th:if="${param.created}" th:text="#{manage.created}"></div>
    <div class="alert info" th:if="${param.cancelled}" th:text="#{manage.cancelled}"></div>

    <div class="card">
        <h1 th:text="#{manage.title}">Appointment details</h1>
        <table>
            <tr><th th:text="#{manage.provider}">Provider</th><td th:text="${provider.displayName}"></td></tr>
            <tr><th th:text="#{manage.when}">When</th>
                <td th:text="${#temporals.format(localStart, 'EEEE dd MMMM yyyy - HH:mm', #locale)} + ' (' + ${provider.zoneId} + ')'"></td></tr>
            <tr><th th:text="#{manage.name}">Name</th><td th:text="${booking.customerName}"></td></tr>
            <tr><th th:text="#{manage.phone}">Phone</th><td class="ltr" th:text="${booking.customerPhone}"></td></tr>
            <tr><th th:text="#{manage.reference}">Reference</th><td class="ltr" th:text="${booking.reference}"></td></tr>
            <tr><th th:text="#{manage.status}">Status</th>
                <td><span class="badge" th:classappend="${booking.status}" th:text="#{'status.' + ${booking.status}}"></span></td></tr>
        </table>

        <form th:if="${booking.active}" th:action="@{'/booking/' + ${booking.reference} + '/cancel'}" method="post"
              th:attr="onsubmit=|return confirm('${#messages.msg('manage.cancel.confirm')}');|">
            <button class="btn danger" type="submit" th:text="#{manage.cancel}">Cancel appointment</button>
        </form>
        <a class="btn secondary" th:href="@{'/' + ${provider.slug}}" th:text="#{manage.another}">Book another time</a>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
